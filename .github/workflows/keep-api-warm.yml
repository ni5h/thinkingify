name: Keep API warm

# Render's free tier spins the API down after ~15 minutes of inactivity
# and cold-starts it on the next request (commonly 30-60s+, since the
# container also runs `alembic upgrade head` before Uvicorn starts) —
# this was the primary cause of slow/multi-click logins. Pinging the
# health endpoint every 10 minutes keeps it from sleeping. This is a
# mitigation, not a fix: it still won't survive Render pausing the
# service during genuinely idle overnight/weekend stretches depending on
# their exact policy, and burns a small Actions minute budget. The
# robust fix is upgrading off the free plan — a billing decision, not
# something this workflow can do.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sS -m 30 -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" https://api.thinkingify.com/health
