[tool.poetry]
name = "thinkingify-api"
version = "0.1.0"
description = "Thinkingify backend — FastAPI + Supabase Postgres/Storage"
authors = []
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.34.0" }
pydantic = { extras = ["email"], version = "^2.0" }
pydantic-settings = "^2.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.29"
alembic = "^1.13"
python-jose = { extras = ["cryptography"], version = "^3.3" }
google-auth = "^2.29"
requests = "^2.32"
supabase = "^2.0"
httpx = "^0.27"
python-multipart = "^0.0.9"
Pillow = "^10.4"
python-slugify = "^8.0"
pyspellchecker = "^0.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
ruff = "^0.6"
aiosqlite = "^0.20"

# Offline content pipeline (Phase 2). Kept out of the served API image, which
# installs `--only main` — nothing under app/pipeline is imported at request
# time. `textstat` scores reading level. Local embeddings use model2vec
# (torch-free, CPU) but it's lazy-imported only when
# pipeline_embedding_adapter=local, so it's an optional `pip install model2vec`
# rather than a hard dependency (the default hash adapter needs nothing).
[tool.poetry.group.pipeline.dependencies]
textstat = "^0.7"
# Local OCR intake for the private reference set (needs the system `tesseract`
# binary too). Runs on-machine only; scan text never reaches a model.
pytesseract = "^0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
